apiVersion: apps/v1
kind: Deployment
metadata:
  name: stylo-shop
  labels:
    app: stylo-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stylo-shop
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: stylo-shop
    spec:
      containers:
        - name: stylo-shop
          image: IMAGE_PLACEHOLDER   # replaced by Jenkins at deploy time
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
